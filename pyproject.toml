[project]
name = "rmit-hack"
version = "0.1.0"
description = "RMIT Hackathon 2026 - Kaggle challenge (local + Modal GPU)"
authors = [
    { name = "Nostidus4", email = "xaongoctan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "modal>=1.6.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.1",
]
